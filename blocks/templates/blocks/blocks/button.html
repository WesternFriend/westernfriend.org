{% load wagtailcore_tags %}
<div class="text-center">
    <a href="{% if value.page_link %}{% pageurl value.page_link %}{% endif %}" class="card-link">
        {% if value.button_text %}
            {{ value.button_text }}
        {% else %}
            {{ value.page_link.title }}
        {% endif %}
    </a>
</div>
