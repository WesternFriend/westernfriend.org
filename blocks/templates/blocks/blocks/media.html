{% load wagtailcore_tags %}{% with media=value.media captions=value.captions %}{% if media %}
    <div>
        {% if media.type == "video" %}
            <video width="{{ media.width }}" height="{{ media.height }}" controls>
                {% for source in media.sources %}<source src="{{ source.src }}" type="{{ source.type }}">{% endfor %}
                {% if captions %}<track kind="captions" src="{% url 'serve_captions' captions.id captions.filename %}" srclang="en" label="Captions" default>{% endif %}
                Your browser does not support the video tag.
            </video>
        {% else %}
            <audio controls>
                {% for source in media.sources %}<source src="{{ source.src }}" type="{{ source.type }}">{% endfor %}
                {% if captions %}<track kind="captions" src="{% url 'serve_captions' captions.id captions.filename %}" srclang="en" label="Captions" default>{% endif %}
                Your browser does not support the audio element.
            </audio>
        {% endif %}
        {% if value.transcript %}
            <section class="transcript">
                <h3>Transcript</h3>
                <div class="prose">
                    {{ value.transcript|richtext }}
                </div>
            </section>
        {% endif %}
    </div>
{% endif %}{% endwith %}
