spec:
  alerts:
    - rule: DEPLOYMENT_FAILED
    - rule: DOMAIN_FAILED
  # Cloudflare caches public pages; App Platform's edge must not cache too
  disable_edge_cache: true
  databases:
    - engine: PG
      name: wf-website-db
      num_nodes: 1
      size: professional-xs
      version: "12"
  domains:
    - domain: preview.westernfriend.org
      type: PRIMARY
  # App-level variables apply to every component: the wf-website service and
  # the migrate pre-deploy job both read them, so they are set once here.
  # Optional features (Sentry, SMTP email, Cloudflare cache purging) turn on
  # as soon as their variables are set, so a placeholder would break them;
  # they are left out here. Add them in the dashboard once you have real
  # values. See docs/deploy.md.
  envs:
    # The buildpack would run collectstatic before the service's build command,
    # and so before the CSS exists; the service runs it itself instead. The job
    # serves no static files and needs no collectstatic at all.
    - key: DISABLE_COLLECTSTATIC
      scope: BUILD_TIME
      value: "1"
    - key: DATABASE_URL
      scope: RUN_TIME
      value: ${wf-website-db.DATABASE_URL}
    - key: DJANGO_SECRET_KEY
      scope: RUN_TIME
      type: SECRET
      value: change-me
    - key: DJANGO_DEBUG
      scope: RUN_TIME
      value: "False"
    # The Spaces settings are run time only here, so the migrate job's build
    # (which installs dependencies) never sees the credentials. wf-website
    # repeats them with build-time scope too, because its build uploads static
    # files to Spaces.
    - key: DJANGO_USE_SPACES
      scope: RUN_TIME
      value: "True"
    - key: AWS_ACCESS_KEY_ID
      scope: RUN_TIME
      type: SECRET
      value: change-me
    - key: AWS_SECRET_ACCESS_KEY
      scope: RUN_TIME
      type: SECRET
      value: change-me
    - key: AWS_S3_REGION_NAME
      scope: RUN_TIME
      value: sfo3
    - key: AWS_STORAGE_BUCKET_NAME
      scope: RUN_TIME
      value: change-me
    - key: DJANGO_DATABASE_CACHE
      scope: RUN_TIME
      value: "True"
  ingress:
    rules:
      - component:
          name: wf-website
        match:
          path:
            prefix: /
  # Runs once per deploy, before any web instance starts, so instances never
  # race each other to migrate. If it fails, the deploy stops and the running
  # version stays live.
  jobs:
    - environment_slug: python
      github:
        branch: main
        deploy_on_push: true
        repo: WesternFriend/westernfriend.org
      instance_count: 1
      instance_size_slug: professional-xs
      kind: PRE_DEPLOY
      name: migrate
      run_command: python manage.py migrate && python manage.py createcachetable django_cache
      source_dir: /
  name:
  region: sfo3
  services:
    - environment_slug: python
      # The compiled CSS is not committed, so build it before collecting static
      # files. The Python buildpack would otherwise run collectstatic itself,
      # before this command and so before the CSS exists; the app-level
      # DISABLE_COLLECTSTATIC turns that off and collectstatic runs here instead.
      build_command: python manage.py download_daisyui && python manage.py tailwind build && python manage.py collectstatic --noinput
      envs:
        # Repeats the app-level Spaces settings with build-time scope as well:
        # the build command's collectstatic uploads to Spaces only when
        # DJANGO_USE_SPACES is "True" during the build. Setting them here, not
        # at the app level, keeps the credentials out of the migrate job's
        # build. A component-level key overrides the app-level one, so keep
        # the values the same in both places, and update both when rotating.
        - key: DJANGO_USE_SPACES
          scope: RUN_AND_BUILD_TIME
          value: "True"
        - key: AWS_ACCESS_KEY_ID
          scope: RUN_AND_BUILD_TIME
          type: SECRET
          value: change-me
        - key: AWS_SECRET_ACCESS_KEY
          scope: RUN_AND_BUILD_TIME
          type: SECRET
          value: change-me
        - key: AWS_S3_REGION_NAME
          scope: RUN_AND_BUILD_TIME
          value: sfo3
        - key: AWS_STORAGE_BUCKET_NAME
          scope: RUN_AND_BUILD_TIME
          value: change-me
        - key: DJANGO_ALLOWED_HOSTS
          scope: RUN_TIME
          value: change.me
        - key: DJANGO_CSRF_TRUSTED_ORIGINS
          scope: RUN_TIME
          value: https://change.me
        - key: PAYPAL_CLIENT_ENVIRONMENT
          scope: RUN_TIME
          value: sandbox
        - key: PAYPAL_CLIENT_ID
          scope: RUN_TIME
          value: change-me
        - key: PAYPAL_CLIENT_SECRET
          scope: RUN_TIME
          type: SECRET
          value: change-me
        - key: DJANGO_PUBLIC_CACHE_EDGE_TTL
          scope: RUN_TIME
          value: "0"
      github:
        branch: main
        deploy_on_push: true
        repo: WesternFriend/westernfriend.org
      http_port: 8080
      instance_count: 1
      instance_size_slug: professional-xs
      name: wf-website
      run_command: gunicorn core.wsgi --log-file -
      source_dir: /
