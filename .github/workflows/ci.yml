name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every check step below is continue-on-error so that one failure doesn't hide
  # another -- e.g. a formatting problem and a failing test show up in the same
  # run. Each job records its checks' outcomes and output in result.json, and
  # the job's last step still turns it red if any check failed.
  lint:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Runs the same hooks contributors run locally, from the same
      # .pre-commit-config.yaml, so CI and `pre-commit install` never disagree.
      # --show-diff-on-failure prints what the auto-fixing hooks (ruff format,
      # djhtml, etc.) would change, so the fix is visible in the PR comment.
      - name: Run pre-commit hooks
        id: pre-commit
        continue-on-error: true
        run: |
          set -o pipefail
          uv run --locked --only-group dev pre-commit run --all-files --show-diff-on-failure --color never 2>&1 | tee /tmp/pre-commit.txt

      - name: Write result for report job
        if: always()
        env:
          PRE_COMMIT_OUTCOME: ${{ steps.pre-commit.outcome }}
        run: |
          touch /tmp/pre-commit.txt
          tail -c 6000 /tmp/pre-commit.txt > /tmp/pre-commit-tail.txt
          jq -n \
            --arg outcome "$PRE_COMMIT_OUTCOME" \
            --rawfile output /tmp/pre-commit-tail.txt \
            '{
              job: "lint",
              checks: {
                "pre-commit hooks (ruff, formatting, templates)": {outcome: $outcome, output: $output, fix: "uv run pre-commit run --all-files"}
              }
            }' > result.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: check-result-lint
          path: result.json
          retention-days: 1

      - name: Fail if any check failed
        if: always()
        run: |
          if [ "${{ steps.pre-commit.outcome }}" != "success" ]; then
            echo "pre-commit hooks failed. See the job summary for details."
            exit 1
          fi

  test:
    name: Django checks and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv installs the Python version pinned in .python-version.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Django system checks
        id: django-check
        continue-on-error: true
        run: |
          set -o pipefail
          uv run --no-sync python manage.py check --fail-level WARNING 2>&1 | tee /tmp/django-check.txt

      - name: Check for missing migrations
        id: migrations
        continue-on-error: true
        run: |
          set -o pipefail
          uv run --no-sync python manage.py makemigrations --check --dry-run 2>&1 | tee /tmp/migrations.txt

      - name: Run tests with coverage
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          uv run --no-sync coverage run manage.py test 2>&1 | tee /tmp/tests.txt

      - name: Generate coverage report
        if: always() && hashFiles('.coverage') != ''
        run: uv run --no-sync coverage xml

      - name: Upload to Codecov
        if: always() && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

      - name: Write result for report job
        if: always()
        env:
          DJANGO_CHECK_OUTCOME: ${{ steps.django-check.outcome }}
          MIGRATIONS_OUTCOME: ${{ steps.migrations.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          for name in django-check migrations tests; do
            touch "/tmp/$name.txt"
            tail -c 4000 "/tmp/$name.txt" > "/tmp/$name-tail.txt"
          done
          jq -n \
            --arg django_check_outcome "$DJANGO_CHECK_OUTCOME" --rawfile django_check_output /tmp/django-check-tail.txt \
            --arg migrations_outcome "$MIGRATIONS_OUTCOME" --rawfile migrations_output /tmp/migrations-tail.txt \
            --arg tests_outcome "$TESTS_OUTCOME" --rawfile tests_output /tmp/tests-tail.txt \
            '{
              job: "test",
              checks: {
                "Django system checks": {outcome: $django_check_outcome, output: $django_check_output, fix: "uv run python manage.py check --fail-level WARNING"},
                "Missing migrations": {outcome: $migrations_outcome, output: $migrations_output, fix: "uv run python manage.py makemigrations"},
                "Tests": {outcome: $tests_outcome, output: $tests_output, fix: "uv run python manage.py test"}
              }
            }' > result.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: check-result-test
          path: result.json
          retention-days: 1

      - name: Fail if any check failed
        if: always()
        run: |
          if [ "${{ steps.django-check.outcome }}" != "success" ] || \
             [ "${{ steps.migrations.outcome }}" != "success" ] || \
             [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "One or more checks failed. See the job summary for details."
            exit 1
          fi

  # Collects every job's result.json, even when a job failed, so the summary and
  # PR comment show all outcomes at once. This is the single check to mark as
  # required in branch protection.
  report:
    name: CI result
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: check-result-*
          path: results

      # Writes the results table to the run's Summary tab and, for pull
      # requests, writes the PR comment body to an artifact rather than posting
      # it. This job's token is read-only (a fork's PR can never get a writable
      # one), so comment-on-pr.yml posts it from a workflow_run trigger, which
      # runs with the base repository's permissions and never executes PR code.
      #
      # Tool output is read from result.json as data, never interpolated with
      # ${{ }}, so a crafted file name or error message can't run as a script.
      - name: Build summary and PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const resultsDir = 'results';
            const jobOrder = ['lint', 'test'];
            const results = fs.existsSync(resultsDir)
              ? fs.readdirSync(resultsDir)
                  .map((dir) => path.join(resultsDir, dir, 'result.json'))
                  .filter((file) => fs.existsSync(file))
                  .map((file) => JSON.parse(fs.readFileSync(file, 'utf8')))
              : [];
            results.sort((a, b) => jobOrder.indexOf(a.job) - jobOrder.indexOf(b.job));

            const failures = [];
            const rows = [];
            for (const result of results) {
              for (const [checkName, check] of Object.entries(result.checks)) {
                const passed = check.outcome === 'success';
                rows.push(`| ${checkName} | ${passed ? '✅ Passed' : '❌ Failed'} |`);
                if (!passed) failures.push({ checkName, ...check });
              }
            }
            // A job that crashed before writing result.json has no rows, so
            // compare against the jobs we expected rather than trusting rows alone.
            const missing = jobOrder.filter((job) => !results.some((r) => r.job === job));
            for (const job of missing) {
              rows.push(`| ${job} job | ⚠️ Did not report (see the workflow run) |`);
            }
            const anyFailed = failures.length > 0 || missing.length > 0;

            const table = ['| Check | Result |', '|---|---|', ...rows, ''];
            // Output can itself contain ``` (e.g. a diff of a Markdown file), so
            // fence it with more backticks than its longest run.
            const fenceFor = (text) =>
              '`'.repeat(Math.max(3, ...(text.match(/`+/g) || []).map((run) => run.length + 1)));
            const details = failures.flatMap((f) => {
              const output = f.output || '(no output captured)';
              const fence = fenceFor(output);
              return [
                `<details><summary>❌ ${f.checkName}</summary>`,
                '',
                fence,
                output,
                fence,
                '',
                `Run \`${f.fix}\` locally to reproduce and fix.`,
                '</details>',
                '',
              ];
            });

            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              ['## CI results', '', ...table, ...details].join('\n') + '\n',
            );

            if (context.eventName !== 'pull_request') return;

            const marker = '<!-- westernfriend-ci-report -->';
            const author = context.payload.pull_request.user.login;
            // The comment is updated in place on reruns, so the author is only
            // notified when it's first created.
            const greeting = anyFailed
              ? [`👋 Hi @${author}, thanks for the pull request! Please take a look at the failing checks below before this is merged.`, '']
              : [];
            const tip = failures.some((f) => f.checkName.startsWith('pre-commit'))
              ? ['💡 Run `uv run pre-commit install` once and these hooks will fix most issues automatically each time you commit.', '']
              : [];

            const body = [
              marker,
              ...greeting,
              '## CI results',
              '',
              ...table,
              ...(anyFailed ? ['## Failures', '', ...details, ...tip] : ['All checks passed. 🎉']),
            ].join('\n');

            fs.writeFileSync('pr-comment.json', JSON.stringify({ pr_number: context.issue.number, marker, body }));

      - name: Upload PR comment artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-comment
          path: pr-comment.json
          retention-days: 1

      - name: Fail if any job failed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more checks failed. See the summary above."
            exit 1
          fi
