name: Comment CI results on PR

# Posting a PR comment needs write access, but CI's "report" job gets a
# read-only token whenever the PR comes from a fork, and granting it more would
# hand the fork's code an elevated token. So "report" builds the comment body
# and uploads it as an artifact (see ci.yml), and this workflow posts it.
# workflow_run always runs this file as committed on the default branch, with
# the base repository's permissions, and nothing from the PR branch executes
# here -- which is what makes it safe.
on:
  workflow_run:
    # Must match ci.yml's top-level `name:` exactly (not its file name). If that
    # name changes, update it here in the same commit, or PR comments silently
    # stop appearing.
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read # to download an artifact from another workflow run
  pull-requests: write

jobs:
  comment:
    name: Post PR comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      # No artifact means the CI run didn't get as far as building the comment
      # (e.g. it was cancelled); skip the rest of the job rather than failing.
      - name: Download PR comment artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      # pr_number comes from the artifact, which "report" filled in from its own
      # event context, because workflow_run.pull_requests isn't reliably
      # populated for runs triggered by forks.
      - name: Post or update PR comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { pr_number, marker, body } = JSON.parse(fs.readFileSync('pr-comment.json', 'utf8'));

            // Walk every page so an older sticky comment on a long PR is found,
            // and only match our own bot so a human quoting the marker isn't edited.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
            });
            const existing = comments.find(
              (comment) => comment.user.login === 'github-actions[bot]' && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                body,
              });
            }
