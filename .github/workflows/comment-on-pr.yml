name: Comment CI results on PR

# Posting a PR comment needs write access, but CI's "report" job gets a
# read-only token whenever the PR comes from a fork, and granting it more would
# hand the fork's code an elevated token. So "report" builds the comment body
# and uploads it as an artifact (see ci.yml), and this workflow posts it.
# workflow_run always runs this file as committed on the default branch, with
# the base repository's permissions, and nothing from the PR branch executes
# here -- which is what makes it safe.
on:
  workflow_run:
    # Must match ci.yml's top-level `name:` exactly (not its file name). If that
    # name changes, update it here in the same commit, or PR comments silently
    # stop appearing.
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read # to download an artifact from another workflow run
  pull-requests: write

# One comment job at a time per PR branch, so two runs finishing together can't
# both create a comment. Keyed on the head repository too, since two forks can
# each have a branch with the same name.
concurrency:
  group: comment-on-pr-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    name: Post PR comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      # No artifact means the CI run didn't get as far as building the comment
      # (e.g. it was cancelled); skip the rest of the job rather than failing.
      - name: Download PR comment artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Post or update PR comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            // The artifact was built by the PR's own workflow run, so a PR that
            // edits ci.yml controls its contents. Only the comment body is taken
            // from it. Which PR to comment on comes from GitHub's event payload
            // (head repository, branch, and commit), never from the artifact.
            // workflow_run.pull_requests isn't populated for forks, so look the
            // PR up by its head instead.
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            const pr = pulls.find((p) => p.head.repo?.full_name === run.head_repository.full_name);
            if (!pr) {
              core.info('No open pull request for this run; nothing to comment on.');
              return;
            }
            // If the PR has moved on to a newer commit, this result is stale and
            // the newer run will post its own, so don't overwrite it.
            if (pr.head.sha !== run.head_sha) {
              core.info(`Run is for ${run.head_sha}, but PR #${pr.number} is now at ${pr.head.sha}; skipping.`);
              return;
            }

            const marker = '<!-- westernfriend-ci-report -->';
            const { body: reportBody } = JSON.parse(fs.readFileSync('pr-comment.json', 'utf8'));
            // GitHub rejects comments over 65,536 characters.
            const body = `${marker}\n${String(reportBody).slice(0, 60000)}`;

            // Walk every page so an older sticky comment on a long PR is found,
            // and only match our own bot so a human quoting the marker isn't edited.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
            });
            const existing = comments.find(
              (comment) => comment.user.login === 'github-actions[bot]' && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
