[project]
name = "Western-Friend-website"
version = "0.1.0"
description = "A website for Western Friend (westernfriend.org), a Quaker publication that provides resources and support for Quaker communities and individuals seeking to live out their faith in the world."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "agpl-3.0-or-later" }
authors = [
    { name = "Brylie Christopher Oxley", email = "brylie@amble.fi" },
    { name = "Mary Klein", email = "editor@westernfriend.org" },
    { name = "Western Friend" },
    { name = "Western Friend Board" },
]
maintainers = [{ name = "Brylie Christopher Oxley", email = "brylie@amble.fi" }]
keywords = [
    # keep-sorted start
    "django",
    "interfaith",
    "quaker",
    "quaker-activism",
    "quaker-archives",
    "quaker-arts",
    "quaker-ecology",
    "quaker-ecumenism",
    "quaker-education",
    "quaker-epistles",
    "quaker-faith",
    "quaker-faith-and-practice",
    "quaker-friends",
    "quaker-history",
    "quaker-letters",
    "quaker-meetings",
    "quaker-organizations",
    "quaker-peace",
    "quaker-philanthropy",
    "quaker-philosophy",
    "quaker-testimonies",
    "quaker-worship",
    "quakerism",
    "wagtail",
    "website",
    "western-friend",
    # keep-sorted end

]
classifiers = [
    # keep-sorted start
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django :: 3.2",
    "Framework :: Django",
    "Framework :: Wagtail",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python",
    "Topic :: Religion :: Quaker",
    "Topic :: Religion",
    # keep-sorted end

]
dependencies = [
    "boto3",
    "dj-database-url",
    "django",
    "django-registration",
    "django-storages",
    "django-timezone-field",
    "gunicorn",
    "psycopg2-binary",
    "python-dotenv",
    "requests",
    "sentry-sdk",
    "tzdata",
    "wagtail",
    "wagtail-color-panel",
    "wagtailmedia",
]

[project.urls]
Homepage = "https://westernfriend.org"
Repository = "https://github.com/WesternFriend/WF-website"

[tool.ruff]
target-version = "py312"
# Migrations are generated by Django and rewritten on every makemigrations.
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
# An explicit list rather than "ALL", so upgrading Ruff never silently turns
# on new rule families. Families deliberately left out:
#   AIR, FAST, NPY, PD, DOC - frameworks/libraries this project doesn't use
#   ANN - type annotations are mypy's job, not the linter's
#   COM, Q, W191, E111/E114/E117 - conflict with `ruff format`
#   CPY - no per-file copyright headers; the LICENSE covers the project
#   D - docstring style is not enforced
#   FA - `from __future__ import annotations` is unneeded on Python 3.12+
#   FIX, TD - TODO comments are allowed
#   PT - tests use Django's unittest-based TestCase, not pytest
select = [
    # keep-sorted start
    "A",     # flake8-builtins: shadowing Python builtins
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async: blocking calls in async code
    "B",     # flake8-bugbear: likely bugs and design problems
    "BLE",   # flake8-blind-except: catching bare Exception
    "C4",    # flake8-comprehensions
    "C90",   # mccabe: cyclomatic complexity
    "DJ",    # flake8-django: Django model and form pitfalls
    "DTZ",   # flake8-datetimez: naive datetimes
    "E",     # pycodestyle errors
    "EM",    # flake8-errmsg: readable tracebacks
    "ERA",   # eradicate: commented-out code
    "EXE",   # flake8-executable: shebang/permission mismatches
    "F",     # Pyflakes: undefined names, unused imports, etc.
    "FBT",   # flake8-boolean-trap: ambiguous positional booleans
    "FLY",   # flynt: prefer f-strings over str.join
    "FURB",  # refurb: modern idioms
    "G",     # flake8-logging-format: lazy logging
    "I",     # isort: import ordering
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420: missing __init__.py
    "INT",   # flake8-gettext: translatable strings
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging: logging API misuse
    "N",     # pep8-naming
    "PERF",  # Perflint: performance anti-patterns
    "PGH",   # pygrep-hooks: blanket noqa, eval, etc.
    "PIE",   # flake8-pie: unnecessary code
    "PL",    # Pylint
    "PTH",   # flake8-use-pathlib
    "PYI",   # flake8-pyi: typing best practices
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # Ruff-specific rules
    "S",     # flake8-bandit: security
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self: private member access
    "SLOT",  # flake8-slots
    "T10",   # flake8-debugger: leftover breakpoints
    "T20",   # flake8-print: leftover print()
    "TC",    # flake8-type-checking
    "TID",   # flake8-tidy-imports
    "TRY",   # tryceratops: exception handling
    "UP",    # pyupgrade: modern Python syntax
    "W",     # pycodestyle warnings
    "YTT",   # flake8-2020: sys.version misuse
    # keep-sorted end
]
ignore = [
    # keep-sorted start
    "ARG001",  # Django passes signal/view args by name, so unused ones can't be dropped
    "ARG002",  # Overridden Django/Wagtail methods must keep the parent signature
    "E501",    # Line length is the formatter's job; it leaves long strings alone
    "PGH003",  # Bare `# type: ignore` is tolerated until mypy runs in CI
    "PLC0415", # Local imports are how Django code breaks circular app imports
    "RUF005",  # `Page.content_panels + [...]` is the documented Wagtail idiom
    "RUF012",  # Django Meta and Wagtail panels are class-level lists by design
    # keep-sorted end
]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = [
    # keep-sorted start
    "N801",    # Test doubles mirror Django's lowercase `class _meta`
    "PLR0915", # Long test methods that build fixtures step by step
    "PLR2004", # Magic values are the expected results under test
    "S105",    # Hardcoded test passwords
    "S106",    # Hardcoded test passwords
    "S311",    # Non-cryptographic random is fine for test data
    "SLF001",  # Tests may inspect private members
    # keep-sorted end
]
"**/factories.py" = [
    # keep-sorted start
    "FBT001", # factory_boy passes post_generation's `create` flag positionally
    "S311",   # Non-cryptographic random is fine for fake data
    # keep-sorted end
]

[tool.ruff.lint.flake8-self]
# Model._meta is Django's documented public Meta API despite the underscore.
extend-ignore-names = ["_meta"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# TODO: add this back in when we figure out how to make it work
[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "wagtail.*"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "core.settings"

[tool.setuptools]
py-modules = []

[tool.coverage.run]
plugins = ['django_coverage_plugin']

[tool.coverage.django_coverage_plugin]
template_extensions = 'html, txt, tex, email'

# Configuration for uv's pip-compile tool used via pre-commit
# This ensures that requirements.txt is automatically generated from pyproject.toml
# to be compatible with Heroku buildpacks and other deployment platforms that require requirements.txt
# The pre-commit hook will run whenever pyproject.toml changes, keeping requirements.txt in sync
# with our actual dependencies while maintaining security and deterministic builds
# - generate-hashes: true
#   - This option generates hashes for all dependencies, ensuring that the exact versions are used.
#   - This is important for security and reproducibility.
# - upgrade: false
#   - This option prevents automatic upgrades of dependencies when resolving.
#   - This ensures consistency between environments and reproducible builds.

[tool.uv.pip]
generate-hashes = true
upgrade = false

[dependency-groups]
dev = [
    "cookiecutter>=2.6.0",
    "coverage>=7.7.1",
    "django-browser-reload>=1.18.0",
    "django-extensions",
    "django-stubs[compatible-mypy]>=5.1.3",
    "django-tailwind[reload]>=4.0.1",
    "django_coverage_plugin",
    "factory-boy>=3.3.3",
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "types-beautifulsoup4>=4.12.0.20250204",
    "types-factory-boy>=0.4.1",
    "types-requests>=2.32.0.20250306",
    "wagtail-factories>=4.2.1",
]
